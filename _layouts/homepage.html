<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Max Argus</title>
  <style>
    body { font-family: Lato, Verdana, Helvetica, sans-serif; font-size: 15px; color: #222; background: #fff; margin: 0; }
    .wrap { max-width: 800px; margin: 0 auto; padding: 32px 16px 48px; }
    a { color: #1772d0; text-decoration: none; } a:hover { color: #f09228; }
    h1 { font-size: 32px; font-weight: 400; margin: 0 0 8px; }
    h2 { font-size: 22px; font-weight: 500; margin: 32px 0 8px; }
    .intro { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
    .intro .text { flex: 1 1 360px; }
    .intro img { width: 220px; max-width: 100%; border-radius: 4px; }
    .links { margin: 12px 0; }
    table { border-collapse: collapse; width: 100%; }
    td { vertical-align: top; padding: 4px 8px 4px 0; }
    td.date { width: 90px; white-space: nowrap; color: #555; }
    .pub { display: flex; gap: 16px; margin: 0 0 16px; align-items: flex-start; }
    .thumb { flex: 0 0 180px; } .thumb img { width: 180px; max-height: 120px; object-fit: contain; border-radius: 4px; }
    .info { flex: 1; min-width: 0; }
    @media (max-width: 560px) { .pub { flex-direction: column; } }
    .pub_unused { margin: 0; } .pub .title { font-weight: 600; } .pub .venue { font-style: italic; }
    .me { font-weight: 700; }
    .hl { background: #ffffd0; padding: 6px 8px; margin-left: -8px; }
    .toggle a { cursor: pointer; } .toggle .on { font-weight: 700; color: #222; }
    footer { margin-top: 40px; font-size: 12px; color: #777; }
  </style>
</head>
<body>
<div class="wrap">
  {{ content }}
  <footer>Layout adapted from <a href="https://www.jessezhang.net/">Jesse Zhang</a>, after <a href="https://jonbarron.info/">Jon Barron</a>.</footer>
</div>
<script>
  function show(all) {
    document.querySelectorAll('.pub').forEach(function (p) {
      p.style.display = (all || p.classList.contains('hl')) ? '' : 'none';
    });
    document.getElementById('t-hl').className = all ? '' : 'on';
    document.getElementById('t-all').className = all ? 'on' : '';
  }
  show(false);
</script>
</body>
</html>
